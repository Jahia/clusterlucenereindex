version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # The Jahia parent and org.jahia.* artifacts define the target Jahia version
      - dependency-name: "org.jahia.*"
      - dependency-name: "org.jahia.*:*"
      # OSGi spec artifacts: never take org.osgi.service.component.annotations 1.5.x (#4).
      # bnd would emit `osgi.extender;osgi.component;version>=1.5`, and Jahia 8.2 ships
      # Felix SCR 2.1.30 (DS 1.4), so the bundle would not resolve.
      - dependency-name: "org.osgi:*"

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-tests-dependencies:
        patterns:
          - "*"
    ignore:
      # cross-fetch >= 3.2.0 hands back an unbound window.fetch; under @jahia/cypress 7 the e2e
      # GraphQL calls then fail with "TypeError: Illegal invocation" (2026-11 e2e runs). Stay on
      # 3.1.x until this harness moves to @jahia/cypress 8, where cross-fetch 4 works.
      - dependency-name: "cross-fetch"
        versions: [">=3.2.0"]
      # Cypress / @jahia/cypress majors must be validated with the e2e harness
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
